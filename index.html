<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>اقساط من</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<header><h1>اقساط من</h1><button id="notifyBtn">🔔 اعلان‌ها</button></header>
<main>
<section class="summary"><div><span>قسط بعدی</span><b id="nextTitle">-</b></div><div><span>مبلغ</span><b id="nextAmount">-</b></div><div><span>سررسید</span><b id="nextDate">-</b></div></section>
<section><div class="sectionHead"><h2>اقساط پیش‌رو</h2><button id="addBtn">+ افزودن</button></div><div id="list"></div></section>
<section><div class="sectionHead"><h2>پرداخت‌شده‌ها</h2></div><div id="paidList"></div></section>
</main>
</div>
<dialog id="formDlg"><form method="dialog" id="form">
<h2>افزودن قسط</h2>
<label>نام قسط<input id="name" required placeholder="مثلاً شرکت"></label>
<label>مبلغ (تومان)<input id="amount" required inputmode="numeric" type="number"></label>
<label>روز پرداخت<input id="day" required min="1" max="31" type="number" value="15"></label>
<label>تاریخ شروع شمسی<input id="start" required placeholder="1405/06/15"></label>
<label>تعداد اقساط<input id="count" min="1" type="number" value="12"></label>
<div class="actions"><button value="cancel">انصراف</button><button id="save" value="default">ذخیره</button></div>
</form></dialog>
<script src="app.js"></script>
</body></html>
